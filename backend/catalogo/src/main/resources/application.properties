spring.application.name=catalogo
# DB
spring.datasource.url=jdbc:mysql://localhost:3306/catalogo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# JWT RSA, custom property
jwt.public-key=src/main/resources/keys/public.pem